<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Detection &amp; Agent · MongoDB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Mono:wght@400;500&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #00684A;
      --green-mid:   #00A35C;
      --green-light: #00ED64;
      --green-bg:    #E8F5EE;
      --grey-50:     #F9FAFB;
      --grey-100:    #F3F4F6;
      --grey-200:    #E5E7EB;
      --grey-400:    #9CA3AF;
      --grey-600:    #4B5563;
      --grey-700:    #374151;
      --grey-900:    #111827;
      --red-bg:      #FEF2F2;
      --red-border:  #FECACA;
      --red:         #DC2626;
      --amber:       #D97706;
      --amber-bg:    #FFFBEB;
      --white:       #FFFFFF;
      --radius:      10px;
      --shadow:      0 1px 3px rgba(0,0,0,.08);
      --shadow-md:   0 4px 6px -1px rgba(0,0,0,.1);
    }

    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', sans-serif; background: var(--grey-100); color: var(--grey-900); display: flex; flex-direction: column; }

    /* ── Header ── */
    header {
      background: var(--green-dark);
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }
    .logo { font-size: 18px; }
    header h1 { color: white; font-size: 15px; font-weight: 600; }
    nav { margin-left: auto; display: flex; gap: 4px; }
    nav a {
      color: rgba(255,255,255,.7);
      text-decoration: none;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 6px;
      transition: background .15s, color .15s;
    }
    nav a:hover { background: rgba(255,255,255,.1); color: white; }
    nav a.active { background: rgba(255,255,255,.15); color: white; font-weight: 500; }

    /* ── Layout ── */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      overflow: hidden;
    }

    /* ── Case list ── */
    .case-list {
      background: var(--white);
      border-right: 1px solid var(--grey-200);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .case-list-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--grey-200);
      flex-shrink: 0;
    }
    .case-list-header h2 { font-size: 12px; font-weight: 600; color: var(--grey-400); text-transform: uppercase; letter-spacing: .6px; }
    .case-list-header .count { font-size: 11px; color: var(--grey-400); margin-top: 2px; }
    #cases { overflow-y: auto; flex: 1; }

    .case-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--grey-100);
      cursor: pointer;
      transition: background .12s;
      position: relative;
    }
    .case-item:hover { background: var(--grey-50); }
    .case-item.selected { background: var(--green-bg); border-left: 3px solid var(--green-dark); }
    .case-item.selected .txn-id { color: var(--green-dark); }

    .txn-id { font-size: 12px; font-weight: 600; color: var(--grey-700); font-family: 'Fira Mono', monospace; }
    .txn-meta { font-size: 11px; color: var(--grey-400); margin-top: 3px; }
    .txn-score {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 5px;
    }
    .txn-score.high     { background: #FEE2E2; color: #DC2626; }
    .txn-score.medium   { background: #FEF3C7; color: #D97706; }
    .txn-score.low      { background: var(--green-bg); color: var(--green-dark); }
    .indicators { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .ind-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--grey-100);
      color: var(--grey-600);
    }
    .investigated-badge {
      position: absolute;
      top: 12px; right: 12px;
      font-size: 10px;
      color: var(--green-mid);
    }

    .empty-cases {
      padding: 32px 16px;
      text-align: center;
      color: var(--grey-400);
      font-size: 13px;
    }

    /* ── Investigation panel ── */
    .investigation-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--grey-400);
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state p { font-size: 14px; }
    .empty-state small { font-size: 12px; }

    /* Active investigation */
    #investigation-view { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    #investigation-view.visible { display: flex; }

    /* Case header */
    .case-header {
      background: var(--white);
      border-bottom: 1px solid var(--grey-200);
      padding: 16px 24px;
      flex-shrink: 0;
    }
    .case-header-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .case-header h2 { font-size: 15px; font-weight: 600; font-family: 'Fira Mono', monospace; }
    .case-header .amount { font-size: 22px; font-weight: 700; color: var(--green-dark); margin-top: 2px; }
    .case-header-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--grey-600); }
    .case-header-meta span { display: flex; align-items: center; gap: 4px; }
    #run-btn {
      background: var(--green-dark);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    #run-btn:hover:not(:disabled) { background: var(--green-mid); }
    #run-btn:disabled { background: var(--grey-200); color: var(--grey-400); cursor: not-allowed; }

    /* Steps + report */
    .investigation-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

    /* Step timeline */
    .steps { display: flex; flex-direction: column; gap: 0; }
    .step {
      display: flex;
      gap: 14px;
      position: relative;
    }
    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2px;
      background: var(--grey-200);
    }
    .step-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--grey-100);
      border: 2px solid var(--grey-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      transition: all .3s;
    }
    .step-icon.running { border-color: var(--green-mid); background: var(--green-bg); animation: pulse 1.2s infinite; }
    .step-icon.done    { border-color: var(--green-dark); background: var(--green-dark); color: white; }
    .step-icon.error   { border-color: var(--red); background: var(--red-bg); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,163,92,.3); }
      50%       { box-shadow: 0 0 0 6px rgba(0,163,92,0); }
    }

    .step-content { padding: 4px 0 20px; flex: 1; min-width: 0; }
    .step-label { font-size: 13px; font-weight: 500; color: var(--grey-700); }
    .step-label.running { color: var(--green-dark); }
    .step-label.done    { color: var(--grey-900); }
    .step-summary {
      margin-top: 6px;
      padding: 8px 12px;
      background: var(--grey-50);
      border: 1px solid var(--grey-200);
      border-radius: 6px;
      font-size: 12px;
      color: var(--grey-600);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .step-summary .kv { display: flex; flex-direction: column; gap: 1px; }
    .step-summary .kv .k { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--grey-400); }
    .step-summary .kv .v { font-weight: 500; color: var(--grey-900); }

    /* Report */
    .report-card {
      background: var(--white);
      border: 1px solid var(--grey-200);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .report-card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--grey-200);
      font-size: 12px;
      font-weight: 600;
      color: var(--grey-400);
      text-transform: uppercase;
      letter-spacing: .5px;
      background: var(--grey-50);
    }
    .report-body {
      padding: 16px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--grey-900);
    }
    .report-body h1, .report-body h2, .report-body h3 { color: var(--green-dark); font-weight: 600; margin: 12px 0 4px; }
    .report-body h1 { font-size: 15px; }
    .report-body h2 { font-size: 14px; }
    .report-body h3 { font-size: 13px; }
    .report-body p  { margin: 6px 0; }
    .report-body ul, .report-body ol { padding-left: 18px; margin: 6px 0; }
    .report-body li { margin: 3px 0; }
    .report-body strong { font-weight: 600; }
    .report-body code {
      background: var(--green-bg);
      color: var(--green-dark);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Fira Mono', monospace;
      font-size: 12px;
    }

    /* Routing badge */
    .routing-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 16px;
    }
    .routing-badge.human    { background: var(--red-bg);  border: 1px solid var(--red-border); color: var(--red); }
    .routing-badge.auto     { background: var(--green-bg); border: 1px solid #B3DFC8;           color: var(--green-dark); }
    .routing-badge.pending  { background: var(--amber-bg); border: 1px solid #FDE68A;           color: var(--amber); }
  </style>
</head>
<body>

<header>
  <div class="logo">🔎</div>
  <h1>Fraud Detection &amp; Agent</h1>
  <nav>
    <a href="/simulate.html">Transaction Simulator</a>
    <a href="/investigate.html" class="active">Investigator</a>
    <a href="/">Analyst Chat</a>
  </nav>
</header>

<div class="workspace">

  <!-- Case list -->
  <div class="case-list">
    <div class="case-list-header">
      <h2>Fraud Cases</h2>
      <div class="count" id="case-count">Loading…</div>
    </div>
    <div id="cases"><div class="empty-cases">Loading cases…</div></div>
  </div>

  <!-- Investigation panel -->
  <div class="investigation-panel">

    <div class="empty-state" id="empty-state">
      <div class="icon">🔎</div>
      <p>Select a fraud case to investigate</p>
      <small>The agent will automatically run the full investigation protocol</small>
    </div>

    <div id="investigation-view">

      <!-- Case header -->
      <div class="case-header">
        <div class="case-header-top">
          <div>
            <h2 id="hdr-txn-id"></h2>
            <div class="amount" id="hdr-amount"></div>
          </div>
          <button id="run-btn" onclick="runInvestigation()">▶ Run Investigation</button>
        </div>
        <div class="case-header-meta" id="hdr-meta"></div>
      </div>

      <!-- Steps + report -->
      <div class="investigation-body" id="inv-body">
        <div class="steps" id="steps"></div>
        <div id="report-container"></div>
      </div>

    </div>
  </div>
</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  let selectedCase = null;
  let busy = false;

  const STEP_META = {
    fetch_fraud_transaction:    { icon: '📋', label: 'Fetch fraud transaction' },
    fetch_user_history:         { icon: '👤', label: 'Retrieve user history' },
    search_similar_fraud_cases: { icon: '🔍', label: 'Search similar fraud cases' },
    write_investigation_findings:{ icon: '✍️', label: 'Write investigation findings' },
  };

  // ── Load case list ────────────────────────────────────────────────────────
  async function loadCases() {
    try {
      const cases = await fetch('/api/fraud-transactions').then(r => r.json());
      const el = document.getElementById('cases');
      document.getElementById('case-count').textContent = `${cases.length} cases`;

      if (!cases.length) {
        el.innerHTML = '<div class="empty-cases">No fraud transactions found</div>';
        return;
      }

      el.innerHTML = cases.map((c, i) => `
        <div class="case-item" id="case-${i}" onclick="selectCase(${i})">
          ${c.investigation?.investigated_at ? '<span class="investigated-badge">✓ done</span>' : ''}
          <div class="txn-id">${c.transaction_id}</div>
          <div class="txn-meta">${c.user_id} · ${c.location?.city ?? ''}, ${c.location?.country ?? ''}</div>
          <div class="indicators">
            ${(c.fraud_indicators ?? []).map(ind => `<span class="ind-tag">${ind}</span>`).join('')}
          </div>
          <span class="txn-score ${scoreClass(c.fraud_score)}">Score ${c.fraud_score}</span>
        </div>
      `).join('');

      // Store cases for selection
      window._cases = cases;
    } catch (e) {
      document.getElementById('cases').innerHTML = `<div class="empty-cases">Failed to load: ${e.message}</div>`;
    }
  }

  function scoreClass(s) {
    if (s >= 80) return 'high';
    if (s >= 50) return 'medium';
    return 'low';
  }

  // ── Select case ───────────────────────────────────────────────────────────
  function selectCase(i) {
    if (busy) return;

    // Highlight selected
    document.querySelectorAll('.case-item').forEach(el => el.classList.remove('selected'));
    document.getElementById(`case-${i}`).classList.add('selected');

    selectedCase = window._cases[i];

    // Show header
    document.getElementById('empty-state').style.display = 'none';
    const view = document.getElementById('investigation-view');
    view.classList.add('visible');

    document.getElementById('hdr-txn-id').textContent = selectedCase.transaction_id;
    document.getElementById('hdr-amount').textContent =
      `${selectedCase.currency ?? 'USD'} ${Number(selectedCase.amount ?? 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}`;

    document.getElementById('hdr-meta').innerHTML = [
      selectedCase.merchant?.merchant_name ? `<span>🏪 ${selectedCase.merchant.merchant_name}</span>` : '',
      selectedCase.location?.city ? `<span>📍 ${selectedCase.location.city}, ${selectedCase.location.country}</span>` : '',
      selectedCase.device?.device_type ? `<span>📱 ${selectedCase.device.device_type} · ${selectedCase.device.os ?? ''}</span>` : '',
      selectedCase.timestamp ? `<span>🕐 ${new Date(selectedCase.timestamp).toLocaleString()}</span>` : '',
    ].join('');

    // Reset investigation body
    document.getElementById('steps').innerHTML = '';
    document.getElementById('report-container').innerHTML = '';
    document.getElementById('run-btn').disabled = false;
    document.getElementById('run-btn').textContent = '▶ Run Investigation';
  }

  // ── Run investigation ─────────────────────────────────────────────────────
  async function runInvestigation() {
    if (!selectedCase || busy) return;
    busy = true;

    const btn = document.getElementById('run-btn');
    btn.disabled = true;
    btn.textContent = '⟳ Investigating…';

    const stepsEl = document.getElementById('steps');
    const reportEl = document.getElementById('report-container');
    stepsEl.innerHTML = '';
    reportEl.innerHTML = '';

    const stepEls = {}; // tool → { iconEl, labelEl, contentEl }

    function addStep(tool) {
      const meta = STEP_META[tool] ?? { icon: '⚙️', label: tool };
      const div = document.createElement('div');
      div.className = 'step';
      div.innerHTML = `
        <div class="step-icon running" id="icon-${tool}">${meta.icon}</div>
        <div class="step-content">
          <div class="step-label running" id="label-${tool}">${meta.label}…</div>
          <div id="summary-${tool}"></div>
        </div>
      `;
      stepsEl.appendChild(div);
      stepEls[tool] = {
        icon:    document.getElementById(`icon-${tool}`),
        label:   document.getElementById(`label-${tool}`),
        summary: document.getElementById(`summary-${tool}`),
      };
      div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function completeStep(tool, result) {
      const s = stepEls[tool];
      if (!s) return;
      s.icon.className  = 'step-icon done';
      s.icon.textContent = '✓';
      s.label.className = 'step-label done';
      s.label.textContent = (STEP_META[tool] ?? { label: tool }).label;
      s.summary.innerHTML = buildSummary(tool, result);
    }

    function buildSummary(tool, result) {
      if (tool === 'fetch_fraud_transaction') {
        const t = result.fraud_transaction ?? {};
        return kv([
          ['Score', t.fraud_score],
          ['Amount', `${t.currency} ${Number(t.amount ?? 0).toLocaleString()}`],
          ['Indicators', (t.fraud_indicators ?? []).join(', ') || '—'],
          ['Location', `${t.location?.city ?? ''}, ${t.location?.country ?? ''}`],
        ]);
      }
      if (tool === 'fetch_user_history') {
        const avg = result.profile?.patterns?.avg_transaction_amount;
        return kv([
          ['Transactions fetched', result.transaction_count],
          ['Avg spend', avg ? `$${Number(avg).toFixed(2)}` : '—'],
        ]);
      }
      if (tool === 'search_similar_fraud_cases') {
        const top = result.results?.[0]?.score;
        return kv([
          ['Similar cases found', result.count],
          ['Top similarity', top != null ? top.toFixed(3) : '—'],
        ]);
      }
      if (tool === 'write_investigation_findings') {
        const routed = result.route_to_human;
        return `<div class="routing-badge ${routed ? 'human' : 'auto'}">
          ${routed ? '🔴 Routed to human review' : '✅ Handled automatically'}
        </div>`;
      }
      return '';
    }

    function kv(pairs) {
      return `<div class="step-summary">${pairs.map(([k, v]) =>
        `<div class="kv"><div class="k">${k}</div><div class="v">${v ?? '—'}</div></div>`
      ).join('')}</div>`;
    }

    try {
      const res = await fetch('/api/investigate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction_id: selectedCase.transaction_id }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); } catch { continue; }

          if (event.type === 'step_start') {
            addStep(event.tool);
          } else if (event.type === 'step_done') {
            completeStep(event.tool, event.result);
          } else if (event.type === 'token') {
            reportEl.innerHTML = `
              <div class="report-card">
                <div class="report-card-header">Investigation Report</div>
                <div class="report-body">${marked.parse(event.text)}</div>
              </div>
            `;
            reportEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else if (event.type === 'error') {
            reportEl.innerHTML = `<div style="color:var(--red);font-size:13px;padding:8px">⚠ ${event.text}</div>`;
          } else if (event.type === 'done') {
            break;
          }
        }
      }

      btn.textContent = '↺ Re-run Investigation';
      // Refresh case list to show ✓ badge
      loadCases().then(() => {
        const i = window._cases?.findIndex(c => c.transaction_id === selectedCase.transaction_id);
        if (i >= 0) document.getElementById(`case-${i}`)?.classList.add('selected');
      });

    } catch (e) {
      reportEl.innerHTML = `<div style="color:var(--red);font-size:13px;padding:8px">⚠ ${e.message}</div>`;
      btn.textContent = '↺ Retry';
    }

    busy = false;
    btn.disabled = false;
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  loadCases();
</script>
</body>
</html>
